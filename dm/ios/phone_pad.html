<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Phone controller</title>
<style>
  :root { --bg:#16181d; --btn:#2a2e37; --btn-on:#4f8cff; --fg:#e8eaf0; --dim:#8a90a0; }
  * { box-sizing:border-box; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:14px system-ui,sans-serif; overflow:hidden; touch-action:none; }
  #pad { position:fixed; inset:0; padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  .b { position:absolute; display:flex; align-items:center; justify-content:center; background:var(--btn); border-radius:50%; font-weight:600; font-size:18px; }
  .b.on { background:var(--btn-on); }
  .sh { border-radius:12px; font-size:15px; }
  .stick { position:absolute; width:34vh; height:34vh; border-radius:50%; background:#20232a; border:2px solid #2f3440; }
  .knob { position:absolute; left:50%; top:50%; width:40%; height:40%; margin:-20% 0 0 -20%; border-radius:50%; background:#3a4050; }
  .stick.on .knob { background:var(--btn-on); }
  #status { position:absolute; left:50%; top:8px; transform:translateX(-50%); text-align:center; color:var(--dim); font-size:13px; }
  #player { font-size:28px; font-weight:700; color:var(--fg); }
  #rotate { display:none; position:fixed; inset:0; background:var(--bg); align-items:center; justify-content:center; font-size:20px; z-index:9; }
  @media (orientation:portrait) { #rotate { display:flex; } }
</style>
</head>
<body>
<div id="rotate" data-t="rotate">Turn your phone sideways ↻</div>
<div id="pad">
  <div id="status"><div id="player">--</div><div id="conn"></div></div>

  <!-- Shoulder buttons -->
  <div class="b sh" data-bit="8" style="left:2vw;top:2vh;width:16vw;height:11vh">ZL</div>
  <div class="b sh" data-bit="6" style="left:2vw;top:15vh;width:16vw;height:11vh">L</div>
  <div class="b sh" data-bit="9" style="right:2vw;top:2vh;width:16vw;height:11vh">ZR</div>
  <div class="b sh" data-bit="7" style="right:2vw;top:15vh;width:16vw;height:11vh">R</div>
  <div class="b" data-bit="11" style="left:38vw;top:22vh;width:9vh;height:9vh">−</div>
  <div class="b" data-bit="10" style="right:38vw;top:22vh;width:9vh;height:9vh">+</div>

  <!-- Left stick -->
  <div class="stick" id="ls" style="left:4vw;top:30vh"><div class="knob"></div></div>

  <!-- D-pad -->
  <div class="b sh" data-bit="13" style="left:calc(30vw + 9vh);top:58vh;width:9vh;height:9vh">▲</div>
  <div class="b sh" data-bit="15" style="left:calc(30vw + 9vh);top:76vh;width:9vh;height:9vh">▼</div>
  <div class="b sh" data-bit="12" style="left:30vw;top:67vh;width:9vh;height:9vh">◀</div>
  <div class="b sh" data-bit="14" style="left:calc(30vw + 18vh);top:67vh;width:9vh;height:9vh">▶</div>

  <!-- ABXY in Switch positions: X top, B bottom, Y left, A right -->
  <div class="b" data-bit="2" style="right:calc(4vw + 13vh);top:30vh;width:13vh;height:13vh">X</div>
  <div class="b" data-bit="1" style="right:calc(4vw + 13vh);top:56vh;width:13vh;height:13vh">B</div>
  <div class="b" data-bit="3" style="right:calc(4vw + 26vh);top:43vh;width:13vh;height:13vh">Y</div>
  <div class="b" data-bit="0" style="right:4vw;top:43vh;width:13vh;height:13vh">A</div>

  <!-- Right stick (smaller) -->
  <div class="stick" id="rs" style="right:30vw;bottom:4vh;width:26vh;height:26vh"><div class="knob"></div></div>
</div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  // Page text: Traditional / Simplified Chinese when the phone's language is Chinese, English otherwise
  const zh = /^zh/i.test(navigator.language || '');
  const T = zh ? { rotate: '請把手機橫過來 ↻', connecting: '連線中…', connected: '已連線', full: '玩家已滿（最多 8 人）', lost: '已斷線，重新連線中…' }
               : { rotate: 'Turn your phone sideways ↻', connecting: 'Connecting…', connected: 'Connected', full: 'All 8 players are taken', lost: 'Disconnected, reconnecting…' };
  if (zh) document.documentElement.lang = 'zh-Hant';
  document.querySelectorAll('[data-t]').forEach(e => { e.textContent = T[e.dataset.t]; });
  const state = { buttons: 0, lx: 0, ly: 0, rx: 0, ry: 0 };
  let ws = null, seq = 0, dirty = true, lastSent = 0, backoff = 500;

  // Device id: a reconnecting phone gets its player back
  let id;
  try { id = localStorage.getItem('padId'); } catch (e) {}
  if (!id) {
    id = (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now().toString(36));
    try { localStorage.setItem('padId', id); } catch (e) {}
  }
  const name = /iPhone|iPad/.test(navigator.userAgent) ? 'iPhone' : /Android/.test(navigator.userAgent) ? 'Android' : 'Browser';

  function connect() {
    const url = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws';
    ws = new WebSocket(url);
    ws.binaryType = 'arraybuffer';
    $('#conn').textContent = T.connecting;
    ws.onopen = () => { backoff = 500; ws.send(JSON.stringify({ t: 'hello', v: 1, id, name })); };
    ws.onmessage = ev => {
      if (typeof ev.data !== 'string') return;
      const m = JSON.parse(ev.data);
      if (m.t === 'assign') { $('#player').textContent = 'P' + m.player; $('#conn').textContent = T.connected; dirty = true; }
      else if (m.t === 'full') { $('#player').textContent = '--'; $('#conn').textContent = T.full; }
      else if (m.t === 'rumble' && navigator.vibrate) navigator.vibrate(m.ms || 100);
    };
    ws.onclose = () => {
      $('#conn').textContent = T.lost;
      setTimeout(connect, backoff);
      backoff = Math.min(backoff * 2, 4000);
    };
  }

  function send() {
    if (!ws || ws.readyState !== 1) return;
    const buf = new ArrayBuffer(8), v = new DataView(buf);
    v.setUint8(0, 1);
    v.setUint8(1, seq = (seq + 1) & 255);
    v.setUint16(2, state.buttons, true);
    v.setInt8(4, state.lx); v.setInt8(5, state.ly);
    v.setInt8(6, state.rx); v.setInt8(7, state.ry);
    ws.send(buf);
    dirty = false; lastSent = performance.now();
  }

  // Send at once on a change, otherwise every 100 ms as a heartbeat
  function tick() {
    if (dirty || performance.now() - lastSent > 100) send();
    requestAnimationFrame(tick);
  }

  // ---- Multi-touch ----
  // Each finger keeps what it landed on: a stick stays held by that finger; on buttons the finger may slide to a neighbour
  const touches = new Map();
  const sticks = { ls: ['lx', 'ly'], rs: ['rx', 'ry'] };

  function targetAt(x, y) {
    const el = document.elementFromPoint(x, y);
    if (!el) return null;
    const st = el.closest('.stick');
    if (st) return st;
    return el.closest('[data-bit]');
  }

  function recompute() {
    let mask = 0;
    document.querySelectorAll('[data-bit]').forEach(e => e.classList.remove('on'));
    for (const t of touches.values()) {
      if (t.el && t.el.dataset.bit !== undefined) { mask |= 1 << +t.el.dataset.bit; t.el.classList.add('on'); }
    }
    if (mask !== state.buttons) {
      if (mask & ~state.buttons && navigator.vibrate) navigator.vibrate(8);
      state.buttons = mask; dirty = true;
    }
  }

  function moveStick(t, x, y) {
    const r = t.el.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2, rad = r.width / 2;
    let dx = (x - cx) / rad, dy = (y - cy) / rad;
    const len = Math.hypot(dx, dy);
    if (len > 1) { dx /= len; dy /= len; }
    const [ax, ay] = sticks[t.el.id];
    state[ax] = Math.round(dx * 127);
    state[ay] = Math.round(-dy * 127); // up is positive
    t.el.querySelector('.knob').style.transform = `translate(${dx * rad * 0.6}px,${dy * rad * 0.6}px)`;
    dirty = true;
  }

  function releaseStick(el) {
    const [ax, ay] = sticks[el.id];
    state[ax] = 0; state[ay] = 0;
    el.querySelector('.knob').style.transform = '';
    el.classList.remove('on');
    dirty = true;
  }

  const pad = $('#pad');
  pad.addEventListener('touchstart', e => {
    e.preventDefault();
    for (const tp of e.changedTouches) {
      const el = targetAt(tp.clientX, tp.clientY);
      const t = { el, stick: !!(el && el.classList.contains('stick')) };
      touches.set(tp.identifier, t);
      if (t.stick) { el.classList.add('on'); moveStick(t, tp.clientX, tp.clientY); }
    }
    recompute();
  }, { passive: false });

  pad.addEventListener('touchmove', e => {
    e.preventDefault();
    for (const tp of e.changedTouches) {
      const t = touches.get(tp.identifier);
      if (!t) continue;
      if (t.stick) moveStick(t, tp.clientX, tp.clientY);
      else t.el = targetAt(tp.clientX, tp.clientY);
    }
    recompute();
  }, { passive: false });

  const end = e => {
    e.preventDefault();
    for (const tp of e.changedTouches) {
      const t = touches.get(tp.identifier);
      if (t && t.stick) releaseStick(t.el);
      touches.delete(tp.identifier);
    }
    recompute();
  };
  pad.addEventListener('touchend', end, { passive: false });
  pad.addEventListener('touchcancel', end, { passive: false });

  // Release everything when the page goes to the background, so nothing stays pressed
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      touches.clear();
      ['ls', 'rs'].forEach(i => releaseStick(document.getElementById(i)));
      recompute(); send();
    }
  });

  // Keep the screen on where the browser allows it
  if (navigator.wakeLock) {
    const lock = () => navigator.wakeLock.request('screen').catch(() => {});
    lock(); document.addEventListener('visibilitychange', () => { if (!document.hidden) lock(); });
  }

  connect();
  tick();
})();
</script>
</body>
</html>
