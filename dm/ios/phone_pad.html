<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Phone controller</title>
<style>
  /* SwitchPad's look (docs/DESIGN.zh-TW.md): graphite, the system blue, rounded rectangles, frosted bars, each player's own colour (--pc) */
  :root { --bg:#000; --btn:#1c1c1e; --btn-on:#0a84ff; --fg:#f5f5f7; --dim:#8e8e93; --line:rgba(255,255,255,.1); --glass:rgba(28,28,30,.72); --pc:#0a84ff; }
  * { box-sizing:border-box; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:14px -apple-system,system-ui,sans-serif; overflow:hidden; touch-action:none; }
  #pad { position:fixed; inset:0; padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  .piece { position:absolute; inset:0; pointer-events:none; }
  .piece > * { pointer-events:auto; }
  /* Xbox layout (the iPad picks it per phone): A bottom, B right, X left, Y top, each button in its Xbox colour (lit in full while pressed) */
  body.xbox .b[data-bit="0"] { --c:#5fbf3f; } body.xbox .b[data-bit="1"] { --c:#ec4134; } body.xbox .b[data-bit="2"] { --c:#3a8ee6; } body.xbox .b[data-bit="3"] { --c:#f2c230; }
  body.xbox .piece[data-k="abxy"] .b { color:var(--c); background:var(--btn); background:color-mix(in srgb, var(--c) 22%, var(--btn)); box-shadow:inset 0 0 0 2px var(--c); font-size:22px; font-weight:800; }
  body.xbox .piece[data-k="abxy"] .b.on { color:#fff; background:var(--c); }
  body.editing .piece.sel > * { outline:2px dashed var(--btn-on); outline-offset:3px; }
  /* Face buttons and the stick stay round, as on a controller; everything else is a rounded rectangle. A press sinks a little and lights up */
  .b { position:absolute; display:flex; align-items:center; justify-content:center; background:var(--btn); box-shadow:inset 0 0 0 1px var(--line); border-radius:50%;
       font-weight:600; font-size:18px; transition:transform .08s ease-out, background-color .08s; }
  .b.on { background:var(--btn-on); transform:scale(.94); }
  .sh { border-radius:14px; font-size:15px; }
  .dpad { position:absolute; }
  .arm { position:absolute; width:33.3%; height:33.3%; display:flex; align-items:center; justify-content:center; background:var(--btn); box-shadow:inset 0 0 0 1px var(--line);
         border-radius:14px; font-weight:600; font-size:16px; color:#c7c7cc; transition:transform .08s ease-out, background-color .08s; }
  .arm.on { background:var(--btn-on); color:#fff; transform:scale(.94); }
  .stick { position:absolute; width:34dvh; height:34dvh; border-radius:50%; background:#111113; box-shadow:inset 0 0 0 1px var(--line), inset 0 6px 18px rgba(0,0,0,.6); }
  .knob { position:absolute; left:50%; top:50%; width:40%; height:40%; margin:-20% 0 0 -20%; border-radius:50%; background:#2c2c2e;
          box-shadow:inset 0 1px 0 rgba(255,255,255,.12), 0 4px 12px rgba(0,0,0,.5); transition:background-color .1s; }
  .stick.on .knob { background:var(--btn-on); }
  /* The top bar: frosted glass, the player in a chip of its own colour */
  #top { position:fixed; left:50%; top:max(6px, env(safe-area-inset-top)); transform:translateX(-50%); display:flex; align-items:center; gap:6px; z-index:5;
         background:var(--glass); -webkit-backdrop-filter:blur(20px) saturate(1.4); backdrop-filter:blur(20px) saturate(1.4); box-shadow:inset 0 0 0 1px var(--line);
         padding:5px; border-radius:16px; }
  #status { display:flex; align-items:center; gap:8px; padding:0 6px; }
  /* The link as a dot, not words: green connected, amber breathing slowly while it (re)connects, red when the players are full. A fixed size, so the bar never jumps */
  #conn { width:8px; height:8px; border-radius:50%; background:#ff9f0a; flex:none; transition:background-color .3s; animation:breathe 2.4s ease-in-out infinite; }
  #conn.ok { background:#30d158; animation:none; }
  #conn.full { background:#ff453a; animation:none; }
  @keyframes breathe { 50% { opacity:.35; } }
  .tb { background:rgba(255,255,255,.1); color:var(--fg); border:0; border-radius:11px; padding:7px 11px; font:inherit; font-size:13px; font-weight:600; transition:transform .1s, opacity .1s; }
  .tb:active { transform:scale(.94); opacity:.8; }
  .tb.on { background:var(--btn-on); }
  #bar { display:none; position:fixed; left:50%; top:max(6px, env(safe-area-inset-top)); transform:translateX(-50%); align-items:center; gap:8px; z-index:6;
         background:var(--glass); -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px); box-shadow:inset 0 0 0 1px var(--line);
         padding:5px 5px 5px 12px; border-radius:16px; white-space:nowrap; color:var(--dim); font-size:13px; }
  body.editing #bar { display:flex; animation:drop .3s cubic-bezier(.2,.9,.3,1.2); }
  body.editing #top { display:none; }
  @keyframes drop { from { opacity:0; transform:translate(-50%, -12px); } }
  #toast { display:none; position:fixed; left:50%; bottom:max(14px, env(safe-area-inset-bottom)); transform:translateX(-50%); background:var(--glass); -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px);
           box-shadow:inset 0 0 0 1px var(--line); padding:11px 16px; border-radius:16px; z-index:7; max-width:90vw; text-align:center; animation:rise .35s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes rise { from { opacity:0; transform:translate(-50%, 16px); } }
  /* Removed, or in use elsewhere: a frosted card over the dimmed pad */
  #kicked { display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:8; align-items:center; justify-content:center; }
  #kicked .card { display:flex; flex-direction:column; align-items:center; gap:16px; max-width:min(440px, 86vw); padding:26px 28px; border-radius:26px; text-align:center; font-size:17px; font-weight:600;
                  background:var(--glass); -webkit-backdrop-filter:blur(30px); backdrop-filter:blur(30px); box-shadow:inset 0 0 0 1px rgba(255,255,255,.12), 0 14px 30px rgba(0,0,0,.45); }
  body.kicked #kicked, body.asking #ask { display:flex; animation:fade .2s ease-out; }
  #ask { display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:8; align-items:center; justify-content:center; }
  #ask .card { display:flex; flex-direction:column; align-items:center; gap:16px; max-width:min(460px, 86vw); padding:26px 28px; border-radius:26px; text-align:center; font-size:16px; font-weight:600;
               background:var(--glass); -webkit-backdrop-filter:blur(30px); backdrop-filter:blur(30px); box-shadow:inset 0 0 0 1px rgba(255,255,255,.12), 0 14px 30px rgba(0,0,0,.45); }
  #ask .card small { color:var(--dim); font-weight:500; font-size:13px; }
  #ask .tb { padding:10px 22px; font-size:15px; border-radius:14px; }
  #hapt { position:fixed; left:0; top:0; width:1px; height:1px; opacity:0; pointer-events:none; overflow:hidden; }
  body.kicked #kicked .card, body.asking #ask .card { animation:pop .45s cubic-bezier(.2,.9,.3,1.25); }
  #kicked .tb { padding:10px 22px; font-size:15px; border-radius:14px; }
  @keyframes fade { from { opacity:0; } }
  @keyframes pop { from { opacity:0; transform:translateY(24px) scale(.9); } }
  #player { font-size:15px; font-weight:800; color:#000; background:var(--pc); border-radius:9px; padding:5px 10px; min-width:44px; text-align:center; transition:background-color .3s; }
  #player.none { color:var(--dim); background:rgba(255,255,255,.1); }
  /* the iPad's "which one is this?" (the launcher's player list): the screen flashes in this player's colour */
  #flash { position:fixed; inset:0; background:var(--pc); opacity:0; pointer-events:none; z-index:10; }
  #flash.on { animation:flash .8s ease-out; }
  @keyframes flash { 0%, 30% { opacity:.75; } 100% { opacity:0; } }
  #rotate { display:none; position:fixed; inset:0; background:var(--bg); flex-direction:column; align-items:center; justify-content:center; gap:14px; font-size:18px; font-weight:600; color:var(--dim); z-index:9; }
  #rotate .phone { width:46px; height:80px; border-radius:12px; box-shadow:inset 0 0 0 3px var(--fg); animation:turn 1.6s ease-in-out infinite; }
  @keyframes turn { 0%, 25% { transform:rotate(0); } 55%, 100% { transform:rotate(-90deg); } }
  @media (orientation:portrait) { #rotate { display:flex; } }
</style>
</head>
<body>
<div id="flash"></div>
<div id="rotate"><div class="phone"></div><div data-t="rotate">Turn your phone sideways</div></div>
<div id="pad">
  <!-- Each piece is a layer over the whole pad holding one control (or one group): the layout editor moves and scales the piece, never its controls -->
  <div class="piece" data-k="zl"><div class="b sh" data-bit="8" style="left:2dvw;top:2dvh;width:16dvw;height:11dvh">ZL</div></div>
  <div class="piece" data-k="l"><div class="b sh" data-bit="6" style="left:2dvw;top:15dvh;width:16dvw;height:11dvh">L</div></div>
  <div class="piece" data-k="zr"><div class="b sh" data-bit="9" style="right:2dvw;top:2dvh;width:16dvw;height:11dvh">ZR</div></div>
  <div class="piece" data-k="r"><div class="b sh" data-bit="7" style="right:2dvw;top:15dvh;width:16dvw;height:11dvh">R</div></div>
  <div class="piece" data-k="minus"><div class="b" data-bit="11" style="left:38dvw;top:22dvh;width:9dvh;height:9dvh">−</div></div>
  <div class="piece" data-k="plus"><div class="b" data-bit="10" style="right:38dvw;top:22dvh;width:9dvh;height:9dvh">+</div></div>

  <!-- Left stick -->
  <div class="piece" data-k="ls"><div class="stick" id="ls" style="left:4dvw;top:30dvh"><div class="knob"></div></div></div>

  <!-- D-pad: one 8-way control (a finger on it rocks it like a real D-pad: a diagonal holds two directions) -->
  <div class="piece" data-k="dpad">
    <div class="dpad" id="dp" style="left:30dvw;top:58dvh;width:27dvh;height:27dvh">
      <div class="arm" data-arm="13" style="left:33.4%;top:0">▲</div>
      <div class="arm" data-arm="15" style="left:33.4%;top:66.6%">▼</div>
      <div class="arm" data-arm="12" style="left:0;top:33.4%">◀</div>
      <div class="arm" data-arm="14" style="left:66.6%;top:33.4%">▶</div>
    </div>
  </div>

  <!-- ABXY in Switch positions: X top, B bottom, Y left, A right -->
  <div class="piece" data-k="abxy">
    <div class="b" data-bit="2" style="right:calc(4dvw + 13dvh);top:30dvh;width:13dvh;height:13dvh">X</div>
    <div class="b" data-bit="1" style="right:calc(4dvw + 13dvh);top:56dvh;width:13dvh;height:13dvh">B</div>
    <div class="b" data-bit="3" style="right:calc(4dvw + 26dvh);top:43dvh;width:13dvh;height:13dvh">Y</div>
    <div class="b" data-bit="0" style="right:4dvw;top:43dvh;width:13dvh;height:13dvh">A</div>
  </div>

  <!-- Right stick (smaller) -->
  <div class="piece" data-k="rs"><div class="stick" id="rs" style="right:30dvw;bottom:4dvh;width:26dvh;height:26dvh"><div class="knob"></div></div></div>
</div>

<!-- Outside the pad, so its taps are ordinary clicks: the player, the full-screen and layout buttons, the layout editor's bar, and the removed notice -->
<div id="top">
  <button class="tb" id="fs" aria-label="Full screen">⛶</button>
  <div id="status"><div id="player" class="none">--</div><div id="conn"></div></div>
  <button class="tb" id="face" aria-label="Button layout">Switch</button>
  <button class="tb" id="motion" aria-label="Motion">Motion</button>
  <button class="tb" id="edit" data-t="layout">Layout</button>
  <button class="tb" id="home" aria-label="Menu">⌂</button>
</div>
<div id="bar">
  <span data-t="drag">Drag to move, pinch to resize</span>
  <button class="tb" id="smaller" aria-label="Smaller">−</button><span data-t="size">Size</span><button class="tb" id="bigger" aria-label="Bigger">+</button>
  <button class="tb" id="reset" data-t="reset">Reset</button>
  <button class="tb on" id="done" data-t="done">Done</button>
</div>
<div id="toast"></div>
<div id="ask"><div class="card"><div id="askmsg"></div><small id="asknote"></small><button class="tb on" id="askok"></button></div></div>
<label id="hapt"><input type="checkbox" switch></label>
<div id="kicked"><div class="card"><div id="kickmsg" data-t="kicked">This phone was removed on the iPad</div><button class="tb on" id="rejoin" data-t="rejoin">Join again</button></div></div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  // Page text: Traditional Chinese when the phone's language is Chinese, English otherwise
  const zh = /^zh/i.test(navigator.language || '');
  const T = zh ? { rotate: '請把手機橫過來', connecting: '連線中…', connected: '已連線', full: '玩家已滿（最多 8 人）', lost: '已斷線，重新連線中…',
                   layout: '版面', drag: '拖曳移動，兩指縮放', size: '大小', reset: '還原', done: '完成',
                   kicked: '這支手機已在 iPad 上被移除', rejoin: '重新加入', replaced: '這支手機的手把在另一個頁面（或瀏覽器）使用中', useHere: '改用這個頁面',
                   ios: 'iPhone 沒辦法讓網頁全螢幕：按 Safari 的「分享」→「加入主畫面」，再從主畫面打開，就不會有網址列。',
                   motion: '體感', mOff: '體感 關', mGyro: '體感 陀螺儀', mTilt: '體感 方向盤',
                   tGyro: '陀螺儀：手機的轉動會傳給遊戲（支援體感的遊戲用得到）', tTilt: '方向盤：左右傾斜手機就是左搖桿，適合賽車', tOff: '體感已關閉',
                   goSecure: '手機只在安全連線（HTTPS）下才給網頁陀螺儀', goNote: '接著會出現「此連線不是私人連線」：點「顯示詳細資訊」→「瀏覽此網站」（Android：「進階」→「繼續前往」）。這是 iPad 自己的憑證，只要信任一次。', goOk: '前往',
                   allow: '讓這個頁面使用手機的動作感測器', allowNote: '按下後在跳出的視窗選「允許」', allowOk: '開啟體感',
                   noSensor: '這支手機或瀏覽器沒有提供陀螺儀', denied: '沒有取得動作感測器的權限：要重新允許，請關掉這個分頁再打開' }
               : { rotate: 'Turn your phone sideways', connecting: 'Connecting…', connected: 'Connected', full: 'All 8 players are taken', lost: 'Disconnected, reconnecting…',
                   layout: 'Layout', drag: 'Drag to move, pinch to resize', size: 'Size', reset: 'Reset', done: 'Done',
                   kicked: 'This phone was removed on the iPad', rejoin: 'Join again', replaced: 'This phone\'s controller is in use on another page (or browser)', useHere: 'Use this page',
                   ios: 'iPhone cannot show a web page full screen: tap Share, then Add to Home Screen in Safari, and open it from the Home Screen for no address bar.',
                   motion: 'Motion', mOff: 'Motion off', mGyro: 'Motion: gyro', mTilt: 'Motion: wheel',
                   tGyro: 'Gyro: the phone\'s turning goes to the game (for games with motion controls)', tTilt: 'Wheel: tilt the phone left and right as the left stick, for racing', tOff: 'Motion is off',
                   goSecure: 'Phones give a page their gyroscope only over a secure connection (HTTPS)', goNote: 'A "connection is not private" warning comes next: tap Show Details, then visit this website (Android: Advanced, then Proceed). It is the iPad\'s own certificate: trust it once.', goOk: 'Go',
                   allow: 'Let this page use the phone\'s motion sensors', allowNote: 'Then choose Allow in the box that appears', allowOk: 'Turn on motion',
                   noSensor: 'This phone or browser gives no gyroscope', denied: 'No access to the motion sensors: to allow it again, close this tab and open it again' };
  if (zh) document.documentElement.lang = 'zh-Hant';
  document.querySelectorAll('[data-t]').forEach(e => { e.textContent = T[e.dataset.t]; });
  // Each player's colour, P1 to P8 (the same on the iPad's screens): the player chip and the identify flash
  const colors = ['#0a84ff', '#ff453a', '#30d158', '#ffd60a', '#bf5af2', '#ff9f0a', '#40c8e0', '#ff375f'];
  function showPlayer(n) {
    const p = $('#player');
    p.textContent = n ? 'P' + n : '--'; p.classList.toggle('none', !n);
    if (n) document.documentElement.style.setProperty('--pc', colors[(n - 1) % 8]);
  }
  function conn(k) { const c = $('#conn'); if (c.className === k) return; c.className = k; c.title = k === 'ok' ? T.connected : k === 'full' ? T.full : T.lost; }
  const state = { buttons: 0, lx: 0, ly: 0, rx: 0, ry: 0 };
  let ws = null, seq = 0, dirty = true, lastSent = 0, backoff = 500, join = false, retry = 0, replaced = false;

  // Device id: a reconnecting phone gets its player back
  let id;
  const params = new URLSearchParams(location.search);
  try { id = params.get('id') || localStorage.getItem('padId'); if (params.get('id')) localStorage.setItem('padId', id); } catch (e) {}
  if (!id) {
    id = (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now().toString(36));
    try { localStorage.setItem('padId', id); } catch (e) {}
  }
  const name = /iPhone|iPad/.test(navigator.userAgent) ? 'iPhone' : /Android/.test(navigator.userAgent) ? 'Android' : 'Browser';

  // A SwitchPad that was suspended and then swiped away never closes its connections: the phone would wait minutes for TCP to give up. The page pings every
  // second and starts over when the iPad has said nothing for 3.5 s
  let lastRx = 0;
  setInterval(() => {
    if (!ws || ws.readyState !== 1 || document.hidden) return;
    if (performance.now() - lastRx > 3500) { const old = ws; ws = null; old.onclose = null; try { old.close(); } catch (e) {} conn('wait'); backoff = 500; connect(); return; }
    try { ws.send('{"t":"ping"}'); } catch (e) {}
  }, 1000);
  function hello() { put(JSON.stringify(join ? { t: 'hello', v: 1, id, name, join: 1 } : { t: 'hello', v: 1, id, name })); join = false; }
  // The link to the iPad: a WebSocket, or over HTTPS where one cannot open (iPhone Safari refuses WebSockets to a certificate the user trusted by hand), POST requests to
  // /p, one at a time, each carrying what waits (only the newest state and motion) and bringing back the iPad's messages
  let usePost = params.get('t') === 'post', postUp = false, inflight = false, postFails = 0, opened = false;
  const queue = [];
  function up() { return usePost ? postUp : !!(ws && ws.readyState === 1); }
  function put(m) {   // a text (string) or binary (ArrayBuffer) message
    if (!usePost) { if (ws && ws.readyState === 1) ws.send(m); return; }
    if (!postUp) return;
    if (typeof m !== 'string') { const k = new Uint8Array(m)[0]; const i = queue.findIndex(q => typeof q !== 'string' && new Uint8Array(q)[0] === k); if (i >= 0) queue.splice(i, 1); }
    queue.push(m); pump();
  }
  function pump() {
    if (inflight || !postUp || !queue.length) return;
    const parts = queue.splice(0).map(m => { const b = typeof m === 'string' ? new TextEncoder().encode(m) : new Uint8Array(m); const f = new Uint8Array(3 + b.length);
                                            f[0] = typeof m === 'string' ? 1 : 2; f[1] = b.length & 255; f[2] = b.length >> 8; f.set(b, 3); return f; });
    const body = new Uint8Array(parts.reduce((n, p) => n + p.length, 0)); let o = 0; for (const p of parts) { body.set(p, o); o += p.length; }
    inflight = true;
    fetch('/p?id=' + encodeURIComponent(id), { method: 'POST', body, cache: 'no-store' })
      .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(t => { postFails = 0; t.split('\n').forEach(l => { if (l) message(JSON.parse(l)); }); })
      .catch(() => { if (++postFails >= 3) lost(); })
      .finally(() => { inflight = false; pump(); });
  }
  function lost() {   // the link went: try again, unless another page of this phone took over
    postUp = false; queue.length = 0;
    if (replaced) return;
    conn('wait');
    retry = setTimeout(connect, backoff);
    backoff = Math.min(backoff * 2, 4000);
  }
  function message(m) {
    if (m.t === 'assign') {
      replaced = false; document.body.classList.remove('kicked'); showPlayer(m.player); conn('ok'); dirty = true;
      faceLayout(m.layout === 'xbox');
    }
    else if (m.t === 'full') { showPlayer(0); conn('full'); toast(T.full); }
    else if (m.t === 'kicked') { showPlayer(0); $('#kickmsg').textContent = T.kicked; $('#rejoin').textContent = T.rejoin; document.body.classList.add('kicked'); release(); }
    else if (m.t === 'replaced') {
      replaced = true; postUp = false; showPlayer(0); $('#kickmsg').textContent = T.replaced; $('#rejoin').textContent = T.useHere; document.body.classList.add('kicked'); release();
    }
    else if (m.t === 'r') rumble(m.l / 255);
    else if (m.t === 'rumble') {
      buzz(m.ms || 100);
      if (m.flash) { const f = $('#flash'); f.classList.remove('on'); void f.offsetWidth; f.classList.add('on'); }
    }
  }
  // Reconnecting: only while the page is in front, and not after the iPad said another page of this phone took over. Otherwise a second page (a background tab,
  // the Home Screen copy, another browser) and this one would keep taking the player from each other, both flickering between connected and disconnected
  function connect() {
    clearTimeout(retry);
    if (replaced || document.hidden || postUp || (ws && ws.readyState < 2)) return;
    conn('wait');
    if (usePost) { postUp = true; backoff = 500; hello(); return; }
    const url = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws';
    ws = new WebSocket(url);
    ws.binaryType = 'arraybuffer';
    ws.onopen = () => { backoff = 500; opened = true; lastRx = performance.now(); hello(); };
    ws.onmessage = ev => { lastRx = performance.now(); if (typeof ev.data === 'string') message(JSON.parse(ev.data)); };
    ws.onclose = () => {
      if (!opened && location.protocol === 'https:') { usePost = true; ws = null; connect(); return; }   // never opened over HTTPS: the certificate; POST requests instead
      if (replaced) return;
      lost();
    };
  }
  // The button layout from the phone itself: the iPad keeps it for this phone and answers with an assign, which redraws the buttons
  $('#face').addEventListener('click', () => { if (up()) put(JSON.stringify({ t: 'layout', xbox: document.body.classList.contains('xbox') ? 0 : 1 })); });
  // The iPad's menu (continue, change games), as a controller's Home button opens it
  $('#home').addEventListener('click', () => { if (up()) put(JSON.stringify({ t: 'home' })); });
  $('#rejoin').addEventListener('click', () => {
    if (replaced) { replaced = false; backoff = 500; if (up()) hello(); else connect(); return; }   // take the player back to this page
    join = true; if (up()) hello();
  });

  // When the Wi-Fi stalls, the browser queues what was sent; piling more on only replays stale input later. Each packet is the whole state, so while a backlog is
  // still waiting nothing more is queued (dirty stays set) and the newest state goes once it drains
  function send() {
    if (!up() || (!usePost && ws.bufferedAmount > 64 && performance.now() - lastSent < 500)) return;   // still a heartbeat every half second, whatever the browser reports
    const buf = new ArrayBuffer(8), v = new DataView(buf);
    v.setUint8(0, 1);
    v.setUint8(1, seq = (seq + 1) & 255);
    v.setUint16(2, state.buttons, true);
    v.setInt8(4, tiltX !== null && Math.abs(state.lx) < 24 && Math.abs(state.ly) < 24 ? tiltX : state.lx); v.setInt8(5, state.ly);   // the wheel, unless the stick is held
    v.setInt8(6, state.rx); v.setInt8(7, state.ry);
    put(buf);
    dirty = false; lastSent = performance.now();
  }

  // Send at once on a change, otherwise every 100 ms as a heartbeat (every 50 ms by POST while the game rumbles: the rumble comes back with the answers)
  function tick() {
    if (dirty || performance.now() - lastSent > (usePost && rumbleLevel ? 50 : 100)) send();
    requestAnimationFrame(tick);
  }

  // ---- Rumble: the game's vibration for this player, a level from 0 to 1 ----
  // Android: the vibration motor, on and off in 40 ms steps for the strength (a page cannot set it), the pattern renewed while the iPad keeps sending the level.
  // iPhone: Safari gives pages no vibration; a switch control's tick (iOS 18) is the one haptic a page can make, so ticks come faster the stronger the rumble
  let rumbleLevel = 0, tickTimer = 0;
  const hapt = $('#hapt');
  function buzz(ms) { if (navigator.vibrate) navigator.vibrate(ms); else hapt.click(); }
  function rumble(l) {
    rumbleLevel = l;
    if (navigator.vibrate) {
      if (l < 0.04) { navigator.vibrate(0); return; }
      const on = Math.max(8, Math.round(40 * Math.min(1, l * 1.3))), pat = [];
      if (on >= 38) pat.push(600); else for (let t = 0; t < 600; t += 40) pat.push(on, 40 - on);
      navigator.vibrate(pat);
      return;
    }
    clearTimeout(tickTimer);
    const step = () => { if (rumbleLevel < 0.15 || document.hidden) return; hapt.click(); tickTimer = setTimeout(step, 230 - 170 * Math.min(1, rumbleLevel)); };
    step();
  }

  // ---- Motion: the phone's gyroscope as the player's six-axis sensor (gyro), or tilting the phone as the left stick (wheel) ----
  // Browsers give a page the motion sensors only over HTTPS, so on http the button moves the page to https (same port: the iPad answers both), handing over the device id
  // so the phone keeps its player; iPhone also asks the person once (a tap). The phone's axes go to the controller's by the screen's rotation: the screen's right is x, its top y,
  // out of the screen z (as DmGamepad.m does for the iPad's own). Browsers disagree on signs and units (iPhone reports gravity the other way round), so both are worked out
  // from the readings: gravity points down out of the back of a phone held as one does, and the gyroscope has to agree with how gravity turns
  const modes = ['off', 'gyro', 'tilt'];
  let motionMode = 'off';
  try { motionMode = params.get('motion') || localStorage.getItem('padMotion') || 'off'; } catch (e) {}
  if (!modes.includes(motionMode) || !window.isSecureContext) motionMode = 'off';   // kept by the https page only
  let tiltX = null, listening = false, mseq = 0, lastMotion = 0;
  let gSign = 0, gVotes = 0, rotScale = 1, fitNum = 0, fitDen = 0, fitMoved = 0, prevG = null, prevT = 0;
  function motionLabel() { $('#motion').textContent = { off: T.mOff, gyro: T.mGyro, tilt: T.mTilt }[motionMode]; $('#motion').classList.toggle('on', motionMode !== 'off'); }
  function ask(msg, note, ok, then) {
    $('#askmsg').textContent = msg; $('#asknote').textContent = note; $('#askok').textContent = ok;
    $('#askok').onclick = () => { document.body.classList.remove('asking'); then(); };
    document.body.classList.add('asking');
  }
  function setMode(m) {
    motionMode = m; motionLabel();
    if (window.isSecureContext) try { localStorage.setItem('padMotion', m); } catch (e) {}
    tiltX = null; dirty = true;
    if (m === 'off') { toast(T.tOff); return; }
    if (!window.isSecureContext) {   // over http: to https, with the device id and the mode
      motionMode = 'off'; motionLabel();
      ask(T.goSecure, T.goNote, T.goOk, () => { location.href = 'https://' + location.host + '/?id=' + encodeURIComponent(id) + '&motion=' + m; });
      return;
    }
    startSensors(true);
  }
  function startSensors(fromTap) {
    if (listening || motionMode === 'off' || !window.isSecureContext) return;
    const need = window.DeviceMotionEvent && DeviceMotionEvent.requestPermission;
    if (!window.DeviceMotionEvent) { toast(T.noSensor); return; }
    if (need && !fromTap) { ask(T.allow, T.allowNote, T.allowOk, () => startSensors(true)); return; }   // iPhone: the permission takes a tap
    const go = () => { listening = true; addEventListener('devicemotion', onMotion); toast(motionMode === 'gyro' ? T.tGyro : T.tTilt); };
    if (need) DeviceMotionEvent.requestPermission().then(r => r === 'granted' ? go() : toast(T.denied)).catch(() => toast(T.denied));
    else go();
  }
  $('#ask').addEventListener('click', e => { if (e.target.id === 'ask') document.body.classList.remove('asking'); });   // a tap beside the card: not now
  $('#motion').addEventListener('click', () => setMode(modes[(modes.indexOf(motionMode) + 1) % modes.length]));
  function nearest(f) {   // degrees or radians, either sign: the one the fit is closest to
    const off = x => Math.abs(Math.log(Math.abs(f) + 1e-9) - Math.log(Math.abs(x))) + (Math.sign(f) !== Math.sign(x) ? 9 : 0);
    return [1, -1, 57.29578, -57.29578].reduce((b, x) => off(x) < off(b) ? x : b);
  }
  function toScreen(x, y) {   // a device-frame (portrait) x, y to the screen's, by its rotation
    const a = ((screen.orientation && typeof screen.orientation.angle === 'number' ? screen.orientation.angle : window.orientation) || 0) * Math.PI / 180;
    const c = Math.cos(a), s = Math.sin(a);
    return [x * c - y * s, x * s + y * c];
  }
  function onMotion(e) {
    const a = e.accelerationIncludingGravity, r = e.rotationRate;
    if (!a || a.x === null || motionMode === 'off') return;
    const [gx0, gy0] = toScreen(a.x, a.y), gz0 = a.z;
    if (gVotes < 12) { gSign += gy0 + gz0 > 0 ? -1 : 1; gVotes++; }   // held as a phone is held, the screen faces up or towards you: gravity is down the screen and out of its back
    const k = (gSign >= 0 ? 1 : -1) / 9.80665, g = [gx0 * k, gy0 * k, gz0 * k];
    if (motionMode === 'tilt') {   // the wheel: the roll about the screen's up axis, 35 degrees for a full turn, a little dead zone
      const roll = Math.atan2(g[0], Math.hypot(g[1], g[2])) * 180 / Math.PI;
      const v = Math.abs(roll) < 3 ? 0 : Math.max(-1, Math.min(1, (roll - Math.sign(roll) * 3) / 32));
      const x = Math.round(v * 127);   // gravity towards the screen's right: the phone turned right
      if (x !== tiltX) { tiltX = x; dirty = true; }
      return;
    }
    if (!r || r.alpha === null) return;
    const [rx, ry] = toScreen(r.beta, r.gamma), w = [rx, ry, r.alpha].map(v => v * Math.PI / 180);
    // The gyroscope's sign and unit from how gravity turns: dg/dt = g x w for gravity seen from the phone. Fitted while the phone moves, then kept
    const t = e.timeStamp / 1000;
    if (prevG && fitMoved < 300 && t - prevT > 0 && t - prevT < 0.1) {   // (how far gravity has turned decides when the fit counts, whatever the gyroscope's unit)
      const dt = t - prevT, d = [(g[0] - prevG[0]) / dt, (g[1] - prevG[1]) / dt, (g[2] - prevG[2]) / dt];
      const c = [g[1] * w[2] - g[2] * w[1], g[2] * w[0] - g[0] * w[2], g[0] * w[1] - g[1] * w[0]];
      fitNum += d[0] * c[0] + d[1] * c[1] + d[2] * c[2]; fitDen += c[0] * c[0] + c[1] * c[1] + c[2] * c[2]; fitMoved += d[0] * d[0] + d[1] * d[1] + d[2] * d[2];
      if (fitMoved > 20 && fitDen > 0) rotScale = nearest(fitNum / fitDen);
    }
    prevG = g; prevT = t;
    if (!up() || performance.now() - lastMotion < 15) return;
    lastMotion = performance.now();
    const buf = new ArrayBuffer(16), v = new DataView(buf), q = x => Math.max(-32767, Math.min(32767, Math.round(x)));
    v.setUint8(0, 3); v.setUint8(1, mseq = (mseq + 1) & 255); v.setUint16(2, Math.round(e.timeStamp) & 0xffff, true);
    for (let i = 0; i < 3; i++) { v.setInt16(4 + 2 * i, q(g[i] * 4096), true); v.setInt16(10 + 2 * i, q(w[i] * rotScale * 180 / Math.PI * 8), true); }
    put(buf);
  }
  motionLabel();
  if (motionMode !== 'off' && window.isSecureContext) startSensors(false);

  // ---- Full screen ----
  // Android: any tap on the pad while not full screen goes full screen (a browser only allows it from a tap), which hides the address bar, and keeps the phone sideways.
  // iPhone Safari has no full screen for pages: the button explains Add to Home Screen instead (the page then opens without the address bar)
  const standalone = navigator.standalone || matchMedia('(display-mode: standalone), (display-mode: fullscreen)').matches;
  const canFull = !!(document.fullscreenEnabled && document.documentElement.requestFullscreen);
  let triedFull = false;
  function toast(text) { const t = $('#toast'); t.textContent = text; t.style.display = 'block'; clearTimeout(toast.timer); toast.timer = setTimeout(() => { t.style.display = 'none'; }, 6000); }
  function goFull() {
    triedFull = true;
    if (!canFull) { if (!standalone) toast(T.ios); return; }
    if (document.fullscreenElement) return;
    document.documentElement.requestFullscreen({ navigationUI: 'hide' })
      .then(() => screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape').catch(() => {})).catch(() => {});
  }
  if (standalone) $('#fs').style.display = 'none';
  $('#fs').addEventListener('click', () => { if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); else goFull(); });

  // ---- Button layout: where A, B, X and Y sit (each button keeps its own letter and sends that button) ----
  const places = { top: ['calc(4dvw + 13dvh)', '30dvh'], bottom: ['calc(4dvw + 13dvh)', '56dvh'], left: ['calc(4dvw + 26dvh)', '43dvh'], right: ['4dvw', '43dvh'] };
  const faces = { switch: { 0: 'right', 1: 'bottom', 2: 'top', 3: 'left' }, xbox: { 0: 'bottom', 1: 'right', 2: 'left', 3: 'top' } };
  function faceLayout(xbox) {
    $('#face').textContent = xbox ? 'Xbox' : 'Switch';
    if (document.body.classList.contains('xbox') === xbox) return;
    document.body.classList.toggle('xbox', xbox);
    const f = faces[xbox ? 'xbox' : 'switch'];
    for (const bit in f) { const e = document.querySelector(`.piece[data-k="abxy"] [data-bit="${bit}"]`); [e.style.right, e.style.top] = places[f[bit]]; }
    applyLayout();
  }

  // ---- Layout ----
  // Each piece (a control or a group) may be moved and scaled; kept per phone in localStorage as {key: {x, y, s}}, x and y as fractions of the pad's size
  const pad = $('#pad');
  const pieces = [...document.querySelectorAll('.piece')];
  let layout = {};
  try { layout = JSON.parse(localStorage.getItem('padLayout') || '{}') || {}; } catch (e) { layout = {}; }
  function applyPiece(p) {
    const l = layout[p.dataset.k] || { x: 0, y: 0, s: 1 };
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;   // the controls' box, untransformed: the piece scales about its centre
    for (const c of p.children) { x0 = Math.min(x0, c.offsetLeft); y0 = Math.min(y0, c.offsetTop); x1 = Math.max(x1, c.offsetLeft + c.offsetWidth); y1 = Math.max(y1, c.offsetTop + c.offsetHeight); }
    p.style.transformOrigin = `${(x0 + x1) / 2}px ${(y0 + y1) / 2}px`;
    p.style.transform = `translate(${l.x * pad.clientWidth}px,${l.y * pad.clientHeight}px) scale(${l.s})`;
  }
  function applyLayout() { pieces.forEach(applyPiece); }
  function saveLayout() { try { localStorage.setItem('padLayout', JSON.stringify(layout)); } catch (e) {} }
  addEventListener('resize', applyLayout);
  applyLayout();

  let editing = false, sel = null, drag = null, pinch = null;
  const editTouches = new Map();
  function spread() { const [a, b] = [...editTouches.values()]; return Math.max(1, Math.hypot(a.x - b.x, a.y - b.y)); }
  function select(p) { pieces.forEach(q => q.classList.toggle('sel', q === p)); sel = p; }
  function scaleSel(f) {
    if (!sel) return;
    const l = layout[sel.dataset.k] || (layout[sel.dataset.k] = { x: 0, y: 0, s: 1 });
    l.s = Math.min(2.5, Math.max(0.4, Math.round(l.s * f * 100) / 100));
    applyPiece(sel);
  }
  $('#edit').addEventListener('click', () => { editTouches.clear(); pinch = drag = null; editing = true; release(); document.body.classList.add('editing'); select(pieces[0]); });
  $('#done').addEventListener('click', () => { editing = false; select(null); document.body.classList.remove('editing'); saveLayout(); });
  $('#reset').addEventListener('click', () => { layout = {}; applyLayout(); saveLayout(); });
  $('#smaller').addEventListener('click', () => scaleSel(1 / 1.1));
  $('#bigger').addEventListener('click', () => scaleSel(1.1));

  // ---- Multi-touch ----
  // Each finger keeps what it landed on: a stick stays held by that finger; on buttons the finger may slide to a neighbour
  const touches = new Map();
  const sticks = { ls: ['lx', 'ly'], rs: ['rx', 'ry'] };

  function targetAt(x, y) {
    const el = document.elementFromPoint(x, y);
    if (!el) return null;
    const st = el.closest('.stick, .dpad');
    if (st) return st;
    return el.closest('[data-bit]');
  }

  function recompute() {
    let mask = 0;
    document.querySelectorAll('[data-bit], [data-arm]').forEach(e => e.classList.remove('on'));
    for (const t of touches.values()) {
      if (t.dpad) mask |= t.bits;
      else if (t.el && t.el.dataset.bit !== undefined) { mask |= 1 << +t.el.dataset.bit; t.el.classList.add('on'); }
    }
    document.querySelectorAll('[data-arm]').forEach(e => { if (mask >> +e.dataset.arm & 1) e.classList.add('on'); });
    if (mask !== state.buttons) {
      if (mask & ~state.buttons && navigator.vibrate) navigator.vibrate(8);
      state.buttons = mask; dirty = true;
      send();   // a press or release goes out now, not on the next frame
    }
  }

  function moveStick(t, x, y) {
    const r = t.el.getBoundingClientRect();   // on screen, so a scaled stick reads its own size
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2, rad = r.width / 2;
    let dx = (x - cx) / rad, dy = (y - cy) / rad;
    const len = Math.hypot(dx, dy);
    if (len > 1) { dx /= len; dy /= len; }
    const [ax, ay] = sticks[t.el.id];
    state[ax] = Math.round(dx * 127);
    state[ay] = Math.round(-dy * 127); // up is positive
    const local = t.el.offsetWidth / 2;   // the knob moves inside the (possibly scaled) stick, in its own units
    t.el.querySelector('.knob').style.transform = `translate(${dx * local * 0.6}px,${dy * local * 0.6}px)`;
    dirty = true;
  }

  // The D-pad: the direction from its centre, each axis held within 67.5° of it, so the eight 45° sectors give four directions and four diagonals;
  // the centre (a quarter of the radius) holds nothing
  function moveDpad(t, x, y) {
    const r = t.el.getBoundingClientRect();
    const dx = x - (r.left + r.width / 2), dy = (r.top + r.height / 2) - y, len = Math.hypot(dx, dy);
    let bits = 0;
    if (len > r.width / 8) {
      const k = 0.3827 * len;   // cos 67.5°
      if (dx > k) bits |= 1 << 14; else if (dx < -k) bits |= 1 << 12;
      if (dy > k) bits |= 1 << 13; else if (dy < -k) bits |= 1 << 15;
    }
    t.bits = bits;
  }

  function releaseStick(el) {
    const [ax, ay] = sticks[el.id];
    state[ax] = 0; state[ay] = 0;
    el.querySelector('.knob').style.transform = '';
    el.classList.remove('on');
    dirty = true;
  }
  function release() {   // nothing stays pressed
    touches.clear();
    ['ls', 'rs'].forEach(i => releaseStick(document.getElementById(i)));
    recompute();
  }

  pad.addEventListener('touchstart', e => {
    e.preventDefault();
    if (editing) {   // the editor: a finger on a control picks its piece and drags it; a second finger anywhere pinches it larger or smaller
      for (const tp of e.changedTouches) editTouches.set(tp.identifier, { x: tp.clientX, y: tp.clientY });
      if (editTouches.size >= 2 && sel) { drag = null; pinch = { d: spread(), s: (layout[sel.dataset.k] || { s: 1 }).s }; return; }
      const tp = e.changedTouches[0], el = document.elementFromPoint(tp.clientX, tp.clientY), p = el && el.closest('.piece');
      if (!p) return;
      select(p);
      const l = layout[p.dataset.k] || (layout[p.dataset.k] = { x: 0, y: 0, s: 1 });
      drag = { id: tp.identifier, x: tp.clientX, y: tp.clientY, lx: l.x, ly: l.y };
      return;
    }
    for (const tp of e.changedTouches) {
      const el = targetAt(tp.clientX, tp.clientY);
      const t = { el, stick: !!(el && el.classList.contains('stick')), dpad: !!(el && el.classList.contains('dpad')), bits: 0 };
      touches.set(tp.identifier, t);
      if (t.stick) { el.classList.add('on'); moveStick(t, tp.clientX, tp.clientY); }
      if (t.dpad) moveDpad(t, tp.clientX, tp.clientY);
    }
    recompute();
  }, { passive: false });

  pad.addEventListener('touchmove', e => {
    e.preventDefault();
    if (editing) {
      for (const tp of e.changedTouches) if (editTouches.has(tp.identifier)) editTouches.set(tp.identifier, { x: tp.clientX, y: tp.clientY });
      if (pinch && sel && editTouches.size >= 2) {
        const l = layout[sel.dataset.k] || (layout[sel.dataset.k] = { x: 0, y: 0, s: 1 });
        l.s = Math.min(2.5, Math.max(0.4, pinch.s * spread() / pinch.d));
        applyPiece(sel);
        return;
      }
      for (const tp of e.changedTouches) if (drag && tp.identifier === drag.id && sel) {
        const l = layout[sel.dataset.k];
        l.x = Math.max(-1, Math.min(1, drag.lx + (tp.clientX - drag.x) / pad.clientWidth));
        l.y = Math.max(-1, Math.min(1, drag.ly + (tp.clientY - drag.y) / pad.clientHeight));
        applyPiece(sel);
      }
      return;
    }
    for (const tp of e.changedTouches) {
      const t = touches.get(tp.identifier);
      if (!t) continue;
      if (t.stick) moveStick(t, tp.clientX, tp.clientY);
      else if (t.dpad) moveDpad(t, tp.clientX, tp.clientY);
      else t.el = targetAt(tp.clientX, tp.clientY);
    }
    recompute();
  }, { passive: false });

  const end = e => {
    e.preventDefault();
    if (editing) {
      for (const tp of e.changedTouches) editTouches.delete(tp.identifier);
      drag = null; if (editTouches.size < 2) pinch = null;
      return;
    }
    for (const tp of e.changedTouches) {
      const t = touches.get(tp.identifier);
      if (t && t.stick) releaseStick(t.el);
      touches.delete(tp.identifier);
    }
    recompute();
    if (e.type === 'touchend' && (canFull ? !document.fullscreenElement : !triedFull)) goFull();   // a touchend counts as the tap full screen needs; Android goes back to it on any tap after leaving it
  };
  pad.addEventListener('touchend', end, { passive: false });
  pad.addEventListener('touchcancel', end, { passive: false });

  // Release everything when the page goes to the background, so nothing stays pressed
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { release(); send(); rumble(0); }
    else connect();   // back in front: reconnect now if the connection went while in the background
  });

  // Keep the screen on where the browser allows it
  if (navigator.wakeLock) {
    const lock = () => navigator.wakeLock.request('screen').catch(() => {});
    lock(); document.addEventListener('visibilitychange', () => { if (!document.hidden) lock(); });
  }

  connect();
  tick();
})();
</script>
</body>
</html>
