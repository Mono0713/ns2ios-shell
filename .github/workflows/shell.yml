name: Build shell

# Builds the game-free shell on a GitHub-hosted Apple silicon runner. The output is a few MB and contains no game content, so it
# neither touches the 2 GB release-asset limit nor puts anyone's game files on GitHub. One shell then serves any game: users run
# scripts/nxn_pack.py on Windows/Linux/macOS to pack their own NSP + prod.keys into it and sideload the resulting IPA.

on:
  workflow_dispatch:
  push:
    paths:
      - 'dm/**'
      - '.github/workflows/shell.yml'

permissions:
  contents: read

concurrency:
  group: shell
  cancel-in-progress: true

jobs:
  shell:
    # iOS 26 SDK is required (project.yml deploymentTarget 26.0, Metal 4 in the graphics layer), so macos-26 / Xcode 26.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Verify the toolchain
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK $SDK"
          test "${SDK%%.*}" -ge 26 || { echo "::error::iOS 26 SDK required, runner has $SDK"; exit 1; }
          df -h "$RUNNER_TEMP"

      - name: Install dependencies
        run: |
          set -euo pipefail
          brew install xcodegen zstd spirv-cross
          python3 -m pip install --quiet --break-system-packages lz4 capstone fonttools \
            || python3 -m pip install --quiet lz4 capstone fonttools

      - name: Check the packer and the tools it drives
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/nxn_pack.py dm/gfx/tools/nometal_run.py dm/ios/tools/pack_ipa.py dm/tools/guest_dylib.py
          python3 scripts/nxn_pack.py --help > /dev/null
          # nometal_run.py answers the four toolchain probes Apple's compiler would answer: if one regresses, every
          # packing attempt on a machine without Xcode dies at the shader step.
          python3 - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location('nm', 'dm/gfx/tools/nometal_run.py')
          m = importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          for cmd, want in ((['xcrun','-sdk','macosx','metal','--version'], 'none'),
                            (['xcrun','-sdk','macosx','metallib','--version'], 'none'),
                            (['xcrun','-sdk','iphoneos','--show-sdk-version'], '26.0'),
                            (['xcrun','-sdk','iphoneos','--show-sdk-build-version'], '26A000')):
              got = m.run(cmd, capture_output=True, text=True).stdout.strip()
              assert got == want, (cmd, got, want)
          print('nometal_run: 4/4 probes answered')
          PY

      - name: Build the shell
        run: bash dm/ios/tools/shell_build.sh
        env:
          # runner.* is only available in step-level expressions, not in a job-level env block.
          DM_ROOT: ${{ runner.temp }}/dm-work

      - name: List the shell's contents
        if: always()
        run: |
          f="$RUNNER_TEMP/dm-work/build/shell/shell_files.tsv"
          if [ -f "$f" ]; then echo "### Shell contents ($(wc -l < "$f" | tr -d ' ') files)"; head -80 "$f"; else echo "no file list produced"; fi >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the shell
        uses: actions/upload-artifact@v4
        with:
          name: nxnative-shell-build-input
          path: ${{ runner.temp }}/dm-work/build/shell/nxnative-shell-build-input.zip
          if-no-files-found: error

      - name: Upload the build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shell-build-log
          path: |
            ${{ runner.temp }}/dm-work/build/shell/build.log
          if-no-files-found: ignore

  # The tools a packing machine needs but cannot easily get: nx_extract and the shader translator are .NET programs, and
  # SPIRV-Cross has no Windows build for the exact tag the shader chain was pinned to. Built here once as self-contained
  # executables, so a Windows user needs neither the .NET SDK nor a C++ toolchain -- only Python and its packages.
  windows-tools:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build nx_extract
        run: dotnet publish dm/tools/nx_extract -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o out/nx_extract

      - name: Build the shader translator
        run: dotnet publish dm/gfx/tools/dmsh_xlate -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o out/dmsh_xlate

      - name: Build SPIRV-Cross at the pinned tag
        run: |
          git clone --branch vulkan-sdk-1.4.357.0 --depth 1 https://github.com/KhronosGroup/SPIRV-Cross
          cmake -S SPIRV-Cross -B SPIRV-Cross/build -G "Visual Studio 17 2022" -A x64 -DSPIRV_CROSS_ENABLE_TESTS=OFF
          cmake --build SPIRV-Cross/build --config Release --target spirv-cross

      - name: Collect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/spirv-cross
          cp SPIRV-Cross/build/output/Release/spirv-cross.exe out/spirv-cross/
          test -f out/nx_extract/nx_extract.exe
          test -f out/dmsh_xlate/dmsh_xlate.exe
          test -f out/spirv-cross/spirv-cross.exe
          ./out/spirv-cross/spirv-cross.exe --help > /dev/null
          ls -l out/nx_extract/nx_extract.exe out/dmsh_xlate/dmsh_xlate.exe out/spirv-cross/spirv-cross.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows-tools
          path: |
            out/nx_extract/nx_extract.exe
            out/dmsh_xlate/dmsh_xlate.exe
            out/spirv-cross/spirv-cross.exe
          if-no-files-found: error
