name: Build shell

# Builds the game-free shell and the Windows-side tools, then publishes them as a release.
#
# Two sources are supported:
#   fork      this repository's tree (default for manual runs and pushes)
#   upstream  the latest seedds/nxnative commit with this fork's changes copied over it, per .shell-overlay.txt
#             (the daily schedule uses this, so an upstream update becomes a new release without anyone acting)
#
# The output contains no game content: a few MB of app plus three Windows executables. Users pack their own game files
# into the shell with scripts/nxn_pack.py and sideload the result.

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Tree to build from (upstream = latest nxnative + this fork''s files, fork = this snapshot)'
        type: choice
        options: [upstream, fork]
        default: upstream
      publish:
        description: 'Publish a release'
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - 'dm/**'
      - 'scripts/**'
      - '.shell-overlay.txt'
      - '.github/workflows/shell.yml'
  schedule:
    - cron: '0 19 * * *'   # daily, 03:00 Beijing time, from upstream

permissions:
  contents: write           # creating releases

concurrency:
  group: shell-build
  cancel-in-progress: false

jobs:
  tools:
    name: Windows tools
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build nx_extract
        run: dotnet publish dm/tools/nx_extract -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o out/nx_extract

      - name: Build the shader translator
        run: dotnet publish dm/gfx/tools/dmsh_xlate -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o out/dmsh_xlate

      - name: Build SPIRV-Cross at the pinned tag
        run: |
          git clone --branch vulkan-sdk-1.4.357.0 --depth 1 https://github.com/KhronosGroup/SPIRV-Cross
          # no -G: the runner's Visual Studio version changes over time and naming it by version is what broke this before
          cmake -S SPIRV-Cross -B SPIRV-Cross/build -DSPIRV_CROSS_ENABLE_TESTS=OFF
          cmake --build SPIRV-Cross/build --config Release --target spirv-cross

      - name: Collect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/spirv-cross
          exe=$(find SPIRV-Cross -name 'spirv-cross.exe' -type f | head -1)
          test -n "$exe" || { echo "::error::spirv-cross.exe was not produced"; exit 1; }
          cp "$exe" out/spirv-cross/
          test -f out/nx_extract/nx_extract.exe
          test -f out/dmsh_xlate/dmsh_xlate.exe
          ./out/spirv-cross/spirv-cross.exe --help > /dev/null
          ls -l out/nx_extract/nx_extract.exe out/dmsh_xlate/dmsh_xlate.exe out/spirv-cross/spirv-cross.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows-tools
          path: |
            out/nx_extract/nx_extract.exe
            out/dmsh_xlate/dmsh_xlate.exe
            out/spirv-cross/spirv-cross.exe
          if-no-files-found: error

  shell:
    name: Shell
    runs-on: macos-26
    timeout-minutes: 60
    outputs:
      version: ${{ steps.tree.outputs.version }}
      origin: ${{ steps.tree.outputs.origin }}
    steps:
      - name: Check out this fork
        uses: actions/checkout@v4
        with:
          path: fork

      - name: Assemble the source tree
        id: tree
        env:
          REQUESTED: ${{ inputs.source || 'upstream' }}   # upstream by default: this repository only carries the diff
        run: |
          # keep this step's output too: a failure here happens before the build log exists
          exec > >(tee "$RUNNER_TEMP/shell.out") 2>&1
          set -euxo pipefail
          source="$REQUESTED"
          src=fork
          if [ "$source" = upstream ]; then
            echo "::group::fetch upstream"
            git clone --depth 1 https://github.com/seedds/nxnative.git up
            UP=$(git -C up rev-parse HEAD)
            echo "upstream commit $UP"
            # Apply this fork onto the upstream tree. Files this fork adds are copied; files it modifies are patched, so an
            # upstream edit elsewhere in the same file survives instead of being overwritten by a whole-file copy.
            while IFS= read -r line; do
              p="${line#+}"; p="${p%%#*}"
              p="$(echo "$p" | tr -d '[:space:]')"
              [ -n "$p" ] || continue
              mkdir -p "up/$(dirname "$p")"
              if [ -d "fork/$p" ]; then cp -a "fork/$p" "up/$(dirname "$p")/"; else cp -a "fork/$p" "up/$p"; fi \
                || { echo "::error::cannot copy $p"; exit 1; }
            done < <(grep -E '^\+' fork/.shell-overlay.txt)

            # absolute: git -C up changes directory, so a relative patch path would resolve inside up/
            PATCHDIR="$(pwd)/fork/.shell-patches"
            n=0
            for f in "$PATCHDIR"/*.patch; do
              [ -e "$f" ] || continue
              if ! git -C up apply --whitespace=nowarn "$f"; then
                echo "::error::$(basename "$f") does not apply: upstream changed the same lines this fork patches."
                echo "Rebase those hunks onto the current upstream text (see docs/SHELL.md), regenerate the patch, push."
                exit 1
              fi
              n=$((n+1))
            done
            echo "applied $n patches"
            src=up
            SHA=$UP   # GITHUB_ENV only reaches later steps; this step needs the value itself for the version string
            echo "::endgroup::"
            echo "origin=upstream $UP" >> "$GITHUB_OUTPUT"
            echo "SHA=$UP" >> "$GITHUB_ENV"
          else
            SHA=$(git -C fork rev-parse HEAD)
            echo "origin=fork $SHA" >> "$GITHUB_OUTPUT"
            echo "SHA=$SHA" >> "$GITHUB_ENV"
          fi
          V="shell-$(date -u +%Y%m%d)-$(echo "$SHA" | cut -c1-7)"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "TREE=$src" >> "$GITHUB_ENV"
          echo "V=$V" >> "$GITHUB_ENV"
          echo "building $V from $src"

      - name: Install dependencies
        run: |
          set -euo pipefail
          # xcodegen builds the project; fontTools is what make_ext_font.py draws the button-icon font with
          brew install xcodegen
          python3 -m pip install --quiet --break-system-packages fonttools \
            || python3 -m pip install --quiet fonttools
          python3 -c "import fontTools; print('fontTools', fontTools.version)"

      - name: Check the packer and the tools it drives
        run: |
          set -euo pipefail
          # cd, not working-directory: ${{ env.X }} does not see values written to GITHUB_ENV at run time
          cd "$TREE"
          python3 -m py_compile scripts/nxn_pack.py dm/gfx/tools/nometal_run.py dm/ios/tools/pack_ipa.py dm/tools/guest_dylib.py
          python3 scripts/nxn_pack.py --help > /dev/null
          # nometal_run.py answers the four toolchain probes Apple's compiler would answer: if one regresses, every
          # packing attempt on a machine without Xcode dies at the shader step.
          python3 - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location('nm', 'dm/gfx/tools/nometal_run.py')
          m = importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          for cmd, want in ((['xcrun','-sdk','macosx','metal','--version'], 'none'),
                            (['xcrun','-sdk','macosx','metallib','--version'], 'none'),
                            (['xcrun','-sdk','iphoneos','--show-sdk-version'], '26.0'),
                            (['xcrun','-sdk','iphoneos','--show-sdk-build-version'], '26A000')):
              got = m.run(cmd, capture_output=True, text=True).stdout.strip()
              assert got == want, (cmd, got, want)
          print('nometal_run: 4/4 probes answered')
          PY

      - name: Build the shell
        env:
          DM_ROOT: ${{ runner.temp }}/dm-work
        run: |
          set -euo pipefail
          cd "$TREE"
          echo "tree: $PWD"
          ls -l dm/ios/tools/shell_build.sh dm/games/0000000000000000/game.tsv
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK $SDK"
          test "${SDK%%.*}" -ge 26 || { echo "::error::iOS 26 SDK required, runner has $SDK"; exit 1; }
          bash dm/ios/tools/shell_build.sh 2>&1 | tee "$RUNNER_TEMP/shell.out"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$DM_ROOT/build/shell/nxnative-shell-build-input.zip" "$GITHUB_WORKSPACE/dist/${V}.zip"   # V already begins with shell-
          cp "$DM_ROOT/build/shell/shell_files.tsv" "$GITHUB_WORKSPACE/dist/${V}-contents.tsv"

      - name: Summarise
        if: always()
        run: |
          f="$GITHUB_WORKSPACE/dist/${V}-contents.tsv"
          {
            echo "### Shell ${V}"
            echo
            echo "- source: ${{ steps.tree.outputs.origin }}"
            if [ -f "$f" ]; then echo "- contents: $(wc -l < "$f" | tr -d ' ') files"; echo '```'; head -40 "$f"; echo '```'; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: shell
          path: dist/*
          if-no-files-found: error

      - name: Upload the build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shell-build-log
          path: |
            ${{ runner.temp }}/dm-work/build/shell/build.log
            ${{ runner.temp }}/shell.out
          if-no-files-found: ignore

  release:
    needs: [tools, shell]
    if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: shell
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: windows-tools
          path: tools

      - name: Pack the tools
        run: |
          set -euo pipefail
          cd tools && zip -qry ../dist/nxnative-windows-tools.zip . && cd ..

      - name: Write the notes
        run: |
          cat > notes.md <<'EOF'
          The game-free shell, plus the three executables a packing machine needs. **Nothing here contains game content.**

          不含任何游戏内容的「壳」，以及打包机器需要的三个可执行文件。**这里没有任何游戏内容。**

          ## Files / 文件

          | File / 文件 | What it is / 说明 |
          |---|---|
          | `<version>.zip` | The shell: an unsigned iOS app with no game content. Pack your own game files into it. <br> 壳：不含游戏内容的未签名 iOS 应用，把自己的游戏文件打进去。 |
          | `nxnative-windows-tools.zip` | `nx_extract.exe`, `dmsh_xlate.exe`, `spirv-cross.exe` — self-contained; no .NET SDK or C++ toolchain needed. <br> 三个自包含可执行文件，无需 .NET SDK 或 C++ 工具链。 |

          ## Use it / 用法

          1. Download both and unpack the tools, e.g. to `D:/nxn-tools`. <br> 下载两个文件，把工具解压到例如 `D:/nxn-tools`。
          2. Put one game's files in a folder; the name must carry the title ID and version:
             `Hades II [0100A00019DE0000][v0].nsp`. A game whose profile lists several versions needs all of them.
             <br> 把一个游戏的文件放进目录，文件名必须带 title ID 和版本号；profile 列了多个版本的游戏需要全部到位。
          3. `python scripts/nxn_pack.py <version>.zip <game folder> -k <prod.keys> --tools D:/nxn-tools`
          4. Sideload the IPA it writes (SideStore, Sideloadly, LiveContainer). The first launch compiles the shaders once.
             <br> 用自签工具装上它产出的 IPA；首次启动会编译一遍着色器。

          The packing machine needs Python 3.9+ with `lz4 capstone fonttools backports.zstd pillow`.
          打包机器需要 Python 3.9+ 以及上述几个包。

          Full instructions, the game list and the naming rules: [README.zh-CN.md](https://github.com/xinerqu/ns2ios-shell/blob/main/README.zh-CN.md)
          · [README.md](https://github.com/xinerqu/ns2ios-shell/blob/main/README.md)

          ## Credits / 致谢

          Built on [nxnative](https://github.com/seedds/nxnative) by **seedds** (MIT) — the rewriter, the translation chain, the
          host and the game profiles are its work. The native-execution approach and the shell route come from
          [d2r-mobile](https://github.com/jhaizhou-ops/d2r-mobile) by **jhaizhou-ops** (MIT), which nxnative's generic parts
          started from; both projects borrow from each other. Two separate projects by two different authors.

          基于 **seedds** 的 nxnative（MIT）——改写器、翻译链、宿主与游戏 profile 都是它的成果。原生执行方案与「壳」路线来自
          **jhaizhou-ops** 的 d2r-mobile（MIT），nxnative 的通用部分即从其起步；两个项目互相借鉴。它们是两个独立项目、两位不同作者。
          EOF

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ needs.shell.outputs.version }}"
          TITLE="Game-free shell ${TAG#shell-}"   # the tag already carries the shell- prefix
          { echo "Source: ${{ needs.shell.outputs.origin }}"; echo; cat notes.md; } > body.md
          gh release create "$TAG" dist/*.zip dist/*.tsv \
            --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes-file body.md \
            || gh release upload "$TAG" dist/*.zip dist/*.tsv --repo "$GITHUB_REPOSITORY" --clobber
          echo "published $TAG" >> "$GITHUB_STEP_SUMMARY"
